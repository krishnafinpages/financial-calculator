<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WealthPulse Pro - Financial Interest & Savings Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        /* Glass Cards for Outputs */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.03);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.2);
        }

        /* Distinct Soft Tinted Background for Input Control Panel */
        .input-control-panel {
            background: #f8fafc; /* Soft light slate tint */
            border: 1px solid #cbd5e1;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
        }
        .dark .input-control-panel {
            background: #1e293b; /* Soft dark slate background */
            border: 1px solid #334155;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        /* Sub-cards for individual input controls */
        .input-item-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
        }
        .dark .input-item-card {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid #334155;
        }

        /* Custom Compact Range Sliders */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            box-shadow: 0 0 4px rgba(99, 102, 241, 0.5);
            transition: all 0.15s ease-in-out;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #4f46e5;
        }

        .compact-input {
            padding: 0.25rem 0.4rem;
            font-size: 0.75rem;
            line-height: 1rem;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white transition-colors duration-200">

    <header class="border-b border-slate-200 dark:border-slate-800/80 bg-white/95 dark:bg-slate-900/90 backdrop-filter backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-3 sm:px-4 h-12 flex items-center justify-between gap-2">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-2 shrink-0">
                <div class="p-1.5 bg-brand-600/10 dark:bg-brand-600/20 text-brand-600 dark:text-brand-400 rounded-lg border border-brand-500/20">
                    <i data-lucide="calculator" class="w-4 h-4"></i>
                </div>
                <h1 class="text-xs sm:text-sm font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-slate-900 via-slate-700 to-slate-900 dark:from-white dark:via-slate-200 dark:to-slate-400">
                    WealthPulse <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-500/20">Pro</span>
                </h1>
            </div>

            <!-- Tab Mode Selection Buttons -->
            <div class="grid grid-cols-3 gap-1 bg-slate-200/70 dark:bg-slate-950/70 p-1 rounded-lg border border-slate-300/50 dark:border-slate-800 text-xs">
                <button onclick="setMode('simple')" id="mode-btn-simple" class="px-2.5 py-1 font-semibold rounded transition-all duration-150 text-center bg-brand-600 text-white shadow-sm">
                    Simple Interest
                </button>
                <button onclick="setMode('compound')" id="mode-btn-compound" class="px-2.5 py-1 font-semibold rounded transition-all duration-150 text-center text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">
                    Compound Interest
                </button>
                <button onclick="setMode('goal')" id="mode-btn-goal" class="px-2.5 py-1 font-semibold rounded transition-all duration-150 text-center text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">
                    Savings Goal
                </button>
            </div>

            <!-- Header Quick Actions -->
            <div class="flex items-center space-x-2 shrink-0">
                <button onclick="downloadCSV()" class="px-2.5 py-1 text-xs font-semibold text-brand-600 dark:text-brand-400 bg-brand-500/10 hover:bg-brand-500/20 rounded-md border border-brand-500/20 flex items-center gap-1 transition-colors">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                    <span class="hidden sm:inline">Export CSV</span>
                </button>
                <button onclick="toggleTheme()" class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Toggle Theme">
                    <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-2 sm:px-3 py-3 space-y-3">
        
        <!-- INPUT CONTROL PANEL: DISTINCT SOFT TINTED BACKGROUND (#f8fafc / #1e293b), 2-ROW COMPACT LAYOUT -->
        <div class="input-control-panel p-3 rounded-xl transition-all duration-200">
            <!-- Header Badge for Input Panel -->
            <div class="flex items-center justify-between mb-2.5 pb-1.5 border-b border-slate-300/60 dark:border-slate-700/60">
                <div class="flex items-center space-x-2">
                    <span class="flex h-2 w-2 rounded-full bg-brand-500 animate-pulse"></span>
                    <span class="text-[11px] font-bold text-slate-700 dark:text-slate-200 uppercase tracking-wider">Input Parameters</span>
                </div>
                <span id="formula-badge" class="text-[10px] font-mono font-medium text-brand-600 dark:text-brand-400 bg-brand-500/10 px-2 py-0.5 rounded border border-brand-500/20">
                    Linear Simple Interest Model
                </span>
            </div>

            <!-- COMPACT 2-ROW GRID LAYOUT -->
            <div class="space-y-2.5">
                
                <!-- ROW 1: Starting Principal & Recurring Deposit (with Deposit Frequency Selector) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                    
                    <!-- INPUT 1: Initial Principal / Starting Balance -->
                    <div class="input-item-card p-2.5 rounded-lg flex flex-col justify-between space-y-2 shadow-sm">
                        <div class="flex justify-between items-center text-xs">
                            <label id="lbl-1" class="font-bold text-slate-800 dark:text-slate-200">Starting Balance ($)</label>
                            <input type="number" id="inp-1-num" value="10000" min="0" max="1000000" step="500"
                                class="compact-input bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded font-bold text-brand-600 dark:text-brand-400 text-right w-28 focus:outline-none focus:ring-1 focus:ring-brand-500">
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="range" id="inp-1-rng" min="0" max="250000" step="500" value="10000" class="w-full h-1.5 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-brand-500">
                        </div>
                    </div>

                    <!-- INPUT 2: Recurring Deposit + Deposit Frequency Selector -->
                    <div class="input-item-card p-2.5 rounded-lg flex flex-col justify-between space-y-2 shadow-sm">
                        <div class="flex justify-between items-center text-xs">
                            <div class="flex items-center gap-2">
                                <label id="lbl-2" class="font-bold text-slate-800 dark:text-slate-200">Recurring Deposit ($)</label>
                                <!-- Frequency Selector Toggle (Monthly vs Yearly) -->
                                <select id="inp-deposit-freq" onchange="recalculate()" class="compact-input bg-slate-100 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-[10px] rounded text-slate-700 dark:text-slate-300 font-bold focus:outline-none focus:ring-1 focus:ring-cyan-500">
                                    <option value="12" selected>Monthly</option>
                                    <option value="1">Yearly</option>
                                </select>
                            </div>
                            <input type="number" id="inp-2-num" value="300" min="0" max="1000000" step="25"
                                class="compact-input bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded font-bold text-cyan-600 dark:text-cyan-400 text-right w-28 focus:outline-none focus:ring-1 focus:ring-cyan-500">
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="range" id="inp-2-rng" min="0" max="5000" step="25" value="300" class="w-full h-1.5 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-500">
                        </div>
                    </div>

                </div>

                <!-- ROW 2: Annual Interest Rate, Compounding Frequency, & Duration -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5">
                    
                    <!-- INPUT 3: Annual Interest Rate / Expected Yield -->
                    <div class="input-item-card p-2.5 rounded-lg flex flex-col justify-between space-y-2 shadow-sm">
                        <div class="flex justify-between items-center text-xs">
                            <label id="lbl-3" class="font-bold text-slate-800 dark:text-slate-200">Annual Rate (%)</label>
                            <input type="number" id="inp-3-num" value="7.0" min="0" max="30" step="0.1"
                                class="compact-input bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded font-bold text-emerald-600 dark:text-emerald-400 text-right w-20 focus:outline-none focus:ring-1 focus:ring-emerald-500">
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="range" id="inp-3-rng" min="0.1" max="25" step="0.1" value="7.0" class="w-full h-1.5 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                        </div>
                    </div>

                    <!-- INPUT 4: Compounding Frequency -->
                    <div class="input-item-card p-2.5 rounded-lg flex flex-col justify-between space-y-2 shadow-sm">
                        <div class="flex justify-between items-center text-xs">
                            <label id="lbl-4" class="font-bold text-slate-800 dark:text-slate-200">Compounding Frequency</label>
                            <span id="compound-disabled-hint" class="hidden text-[10px] text-amber-500 font-medium">N/A (Simple)</span>
                        </div>
                        <select id="inp-compound-freq" onchange="recalculate()" class="w-full compact-input bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs rounded text-slate-800 dark:text-slate-200 font-semibold focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <option value="365">Daily (365/yr)</option>
                            <option value="12" selected>Monthly (12/yr)</option>
                            <option value="4">Quarterly (4/yr)</option>
                            <option value="2">Semi-Annually (2/yr)</option>
                            <option value="1">Annually (1/yr)</option>
                        </select>
                    </div>

                    <!-- INPUT 5: Time Horizon / Duration in Years -->
                    <div class="input-item-card p-2.5 rounded-lg flex flex-col justify-between space-y-2 shadow-sm">
                        <div class="flex justify-between items-center text-xs">
                            <label id="lbl-5" class="font-bold text-slate-800 dark:text-slate-200">Duration (Years)</label>
                            <input type="number" id="inp-4-num" value="10" min="1" max="50" step="1"
                                class="compact-input bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded font-bold text-indigo-600 dark:text-indigo-400 text-right w-20 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="range" id="inp-4-rng" min="1" max="40" step="1" value="10" class="w-full h-1.5 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                        </div>
                    </div>

                </div>

            </div>
        </div>

        <div class="space-y-3">
            
            <!-- Dynamic 4 KPI Metric Cards Ribbon -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                <div class="glass-card p-3 rounded-xl flex flex-col justify-between">
                    <span id="card-label-1" class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Total Balance</span>
                    <span id="card-val-1" class="text-sm sm:text-lg font-extrabold text-brand-600 dark:text-brand-400">$0</span>
                </div>
                <div class="glass-card p-3 rounded-xl flex flex-col justify-between">
                    <span id="card-label-2" class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Total Contributions</span>
                    <span id="card-val-2" class="text-sm sm:text-lg font-extrabold text-slate-800 dark:text-slate-100">$0</span>
                </div>
                <div class="glass-card p-3 rounded-xl flex flex-col justify-between">
                    <span id="card-label-3" class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Total Interest Earned</span>
                    <span id="card-val-3" class="text-sm sm:text-lg font-extrabold text-emerald-600 dark:text-emerald-400">$0</span>
                </div>
                <div id="card-highlight" class="glass-card p-3 rounded-xl flex flex-col justify-between bg-brand-500/5 dark:bg-brand-500/10 border-brand-500/20">
                    <span id="card-label-4" class="text-[10px] font-bold text-brand-600 dark:text-brand-400 uppercase tracking-wider">Effective APY / Growth</span>
                    <span id="card-val-4" class="text-sm sm:text-lg font-extrabold text-brand-600 dark:text-brand-400">0.0%</span>
                </div>
            </div>

            <div class="glass-card p-3 rounded-xl flex flex-col justify-between space-y-2 border border-slate-200 dark:border-slate-800">
                <div class="flex items-center justify-between text-xs px-1">
                    <span id="chart-title" class="font-bold text-slate-800 dark:text-slate-200">Growth Trajectory</span>
                    <span id="chart-sub" class="text-[10px] text-slate-500 dark:text-slate-400">Contributions vs Interest Over Time</span>
                </div>
                <div class="h-56 sm:h-64 w-full relative">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

            <div class="glass-card p-2.5 rounded-xl border border-slate-200 dark:border-slate-800">
                <div id="insight-container" class="grid grid-cols-1 md:grid-cols-3 gap-2 text-[11px] text-slate-600 dark:text-slate-300">
                    <!-- Dynamically populated via JS -->
                </div>
            </div>

            <div class="glass-card rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800">
                <button onclick="toggleAccordion()" class="w-full px-3.5 py-2 flex items-center justify-between text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-slate-100/50 dark:hover:bg-slate-900/50 transition-colors">
                    <span class="flex items-center gap-2">
                        <i data-lucide="table" class="w-4 h-4 text-brand-500"></i> Annual Amortization & Breakdown Schedule
                    </span>
                    <div class="flex items-center space-x-3">
                        <span onclick="event.stopPropagation(); downloadCSV()" class="text-[11px] text-brand-600 dark:text-brand-400 hover:underline flex items-center gap-1 font-semibold">
                            <i data-lucide="download" class="w-3.5 h-3.5"></i> Export
                        </span>
                        <i id="table-arrow" data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200"></i>
                    </div>
                </button>
                <div id="table-container" class="hidden border-t border-slate-200 dark:border-slate-800 max-h-56 overflow-y-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-100 dark:bg-slate-900/90 text-slate-500 dark:text-slate-400 font-semibold sticky top-0 border-b border-slate-200 dark:border-slate-800">
                            <tr>
                                <th id="th-col-1" class="p-2">Period</th>
                                <th id="th-col-2" class="p-2">Total Contributions</th>
                                <th id="th-col-3" class="p-2">Interest Earned</th>
                                <th id="th-col-4" class="p-2">Ending Balance</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-200 dark:divide-slate-800/50">
                            <!-- Dynamic rows generated via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Global App State
        let currentMode = 'simple'; // 'simple' | 'compound' | 'goal'
        let chartInstance = null;
        let activeExportData = [];

        // Number Formatting Helpers
        const formatCurr = (num) => {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                maximumFractionDigits: 0
            }).format(num);
        };

        const formatCompact = (num) => {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                notation: 'compact',
                maximumFractionDigits: 1
            }).format(num);
        };

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            setTimeout(() => {
                recalculate();
            }, 50);
        }

        function toggleAccordion() {
            const container = document.getElementById('table-container');
            const arrow = document.getElementById('table-arrow');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                arrow.style.transform = 'rotate(180deg)';
            } else {
                container.classList.add('hidden');
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        function getChartTextColor() {
            return document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b';
        }

        function getChartGridColor() {
            return document.documentElement.classList.contains('dark') ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
        }

        // Mode Switching UI and Dynamic Input Adaptations
        function setMode(mode) {
            currentMode = mode;

            // Nav buttons state update
            ['simple', 'compound', 'goal'].forEach(m => {
                const btn = document.getElementById(`mode-btn-${m}`);
                if (m === mode) {
                    btn.className = "px-2.5 py-1 font-semibold rounded transition-all duration-150 text-center bg-brand-600 text-white shadow-sm";
                } else {
                    btn.className = "px-2.5 py-1 font-semibold rounded transition-all duration-150 text-center text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200";
                }
            });

            // Input elements references
            const lbl1 = document.getElementById('lbl-1');
            const rng1 = document.getElementById('inp-1-rng');
            const lbl2 = document.getElementById('lbl-2');
            const rng2 = document.getElementById('inp-2-rng');
            const inp2Num = document.getElementById('inp-2-num');
            const lbl3 = document.getElementById('lbl-3');
            const freqSelect = document.getElementById('inp-compound-freq');
            const disabledHint = document.getElementById('compound-disabled-hint');
            const formulaBadge = document.getElementById('formula-badge');

            if (mode === 'simple') {
                formulaBadge.innerText = 'Linear Simple Interest Model';
                lbl1.innerText = 'Starting Balance ($)';
                rng1.max = "250000";

                lbl2.innerText = 'Recurring Deposit ($)';
                rng2.max = "5000";

                lbl3.innerText = 'Annual Rate (%)';
                freqSelect.disabled = true;
                freqSelect.classList.add('opacity-50', 'cursor-not-allowed');
                disabledHint.classList.remove('hidden');
            } 
            else if (mode === 'compound') {
                formulaBadge.innerText = 'Exponential Compound Interest Model';
                lbl1.innerText = 'Starting Balance ($)';
                rng1.max = "250000";

                lbl2.innerText = 'Recurring Deposit ($)';
                rng2.max = "5000";

                lbl3.innerText = 'Annual Rate (%)';
                freqSelect.disabled = false;
                freqSelect.classList.remove('opacity-50', 'cursor-not-allowed');
                disabledHint.classList.add('hidden');
            } 
            else if (mode === 'goal') {
                formulaBadge.innerText = 'Reverse Target Savings Solver';
                lbl1.innerText = 'Current Savings ($)';
                rng1.max = "250000";

                lbl2.innerText = 'Target Goal ($)';
                rng2.max = "1000000";
                if(parseFloat(inp2Num.value) < 10000) {
                    inp2Num.value = "100000";
                    rng2.value = "100000";
                }

                lbl3.innerText = 'Expected Yield (%)';
                freqSelect.disabled = false;
                freqSelect.classList.remove('opacity-50', 'cursor-not-allowed');
                disabledHint.classList.add('hidden');
            }

            recalculate();
        }

        function recalculate() {
            if (currentMode === 'simple') calcSimple();
            else if (currentMode === 'compound') calcCompound();
            else if (currentMode === 'goal') calcGoal();
        }

        function calcSimple() {
            const P = parseFloat(document.getElementById('inp-1-num').value) || 0;
            const PMT = parseFloat(document.getElementById('inp-2-num').value) || 0;
            const depFreq = parseInt(document.getElementById('inp-deposit-freq').value) || 12; // 12 for Monthly, 1 for Yearly
            const r = (parseFloat(document.getElementById('inp-3-num').value) || 0) / 100;
            const years = Math.max(1, parseFloat(document.getElementById('inp-4-num').value) || 1);

            const labels = ['Start'];
            const principalData = [P];
            const interestData = [0];
            const tableRows = [];
            activeExportData = [];

            let totalDeposits = P;
            let currentInterest = 0;

            for (let y = 1; y <= years; y++) {
                const yearDeposits = PMT * depFreq;
                totalDeposits += yearDeposits;
                
                // Simple interest on initial principal for y years
                const interestP = P * r * y;
                // Simple interest on recurring deposits made over y years
                const totalNumDeposits = depFreq * y;
                const interestPMT = PMT * r * (totalNumDeposits * (totalNumDeposits + 1) / (2 * depFreq));
                
                currentInterest = interestP + interestPMT;
                const endBalance = totalDeposits + currentInterest;

                labels.push(`Yr ${y}`);
                principalData.push(totalDeposits);
                interestData.push(currentInterest);

                tableRows.push(`
                    <tr class="hover:bg-slate-100 dark:hover:bg-slate-800/40 transition-colors">
                        <td class="p-2 font-medium text-slate-800 dark:text-slate-200">Year ${y}</td>
                        <td class="p-2 text-slate-500 dark:text-slate-400">${formatCurr(totalDeposits)}</td>
                        <td class="p-2 text-emerald-600 dark:text-emerald-400">+${formatCurr(currentInterest)}</td>
                        <td class="p-2 font-semibold text-brand-600 dark:text-brand-300">${formatCurr(endBalance)}</td>
                    </tr>
                `);

                activeExportData.push({
                    Year: y,
                    Contributions: totalDeposits.toFixed(2),
                    Interest: currentInterest.toFixed(2),
                    Balance: endBalance.toFixed(2)
                });
            }

            const totalBalance = totalDeposits + currentInterest;
            const growthRatio = totalDeposits > 0 ? (currentInterest / totalDeposits) * 100 : 0;

            // Update KPI Cards
            document.getElementById('card-label-1').innerText = "Total Balance";
            document.getElementById('card-val-1').innerText = formatCurr(totalBalance);

            document.getElementById('card-label-2').innerText = "Total Contributions";
            document.getElementById('card-val-2').innerText = formatCurr(totalDeposits);

            document.getElementById('card-label-3').innerText = "Simple Interest Earned";
            document.getElementById('card-val-3').innerText = formatCurr(currentInterest);

            document.getElementById('card-label-4').innerText = "Simple Return";
            document.getElementById('card-val-4').innerText = `${growthRatio.toFixed(1)}%`;

            // Update Breakdown Table
            document.getElementById('th-col-1').innerText = "Period";
            document.getElementById('th-col-2').innerText = "Total Contributions";
            document.getElementById('th-col-3').innerText = "Interest Earned";
            document.getElementById('th-col-4').innerText = "Total Balance";
            document.getElementById('table-body').innerHTML = tableRows.join('');

            // Chart Render
            document.getElementById('chart-title').innerText = "Linear Interest Growth Path";
            document.getElementById('chart-sub').innerText = "Principal & Regular Deposits vs Simple Interest";

            renderLineChart(labels, [
                {
                    label: 'Total Contributions ($)',
                    data: principalData,
                    borderColor: '#94a3b8',
                    borderDash: [4, 4],
                    borderWidth: 1.5,
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: 'Total Balance ($)',
                    data: principalData.map((p, idx) => p + interestData[idx]),
                    borderColor: '#6366f1',
                    backgroundColor: 'rgba(99, 102, 241, 0.12)',
                    borderWidth: 2.5,
                    fill: true,
                    tension: 0.1
                }
            ]);

            renderInsights('simple', { P, PMT, currentInterest, years, totalDeposits });
        }

        function calcCompound() {
            const P = parseFloat(document.getElementById('inp-1-num').value) || 0;
            const PMT = parseFloat(document.getElementById('inp-2-num').value) || 0;
            const depFreq = parseInt(document.getElementById('inp-deposit-freq').value) || 12; // Monthly vs Yearly
            const r = (parseFloat(document.getElementById('inp-3-num').value) || 0) / 100;
            const n = parseInt(document.getElementById('inp-compound-freq').value) || 12;
            const years = Math.max(1, Math.round(parseFloat(document.getElementById('inp-4-num').value) || 1));

            const labels = ['Start'];
            const principalData = [P];
            const interestData = [0];
            const tableRows = [];
            activeExportData = [];

            let currentBalance = P;
            let totalDeposited = P;

            // Simulation step: standard monthly iteration for fine accuracy
            const months = years * 12;
            const monthlyRate = r / n;

            for (let y = 1; y <= years; y++) {
                for (let m = 1; m <= 12; m++) {
                    // Add deposit if matching deposit frequency
                    if (depFreq === 12 || (depFreq === 1 && m === 12)) {
                        currentBalance += PMT;
                        totalDeposited += PMT;
                    }
                    
                    // Compound interest according to frequency
                    // Daily (365) ~ continuous daily compound; Monthly (12); etc.
                    const compoundFactor = (n / 12);
                    currentBalance *= Math.pow(1 + r / n, compoundFactor);
                }

                const totalInterestEarned = Math.max(0, currentBalance - totalDeposited);

                labels.push(`Yr ${y}`);
                principalData.push(totalDeposited);
                interestData.push(totalInterestEarned);

                tableRows.push(`
                    <tr class="hover:bg-slate-100 dark:hover:bg-slate-800/40 transition-colors">
                        <td class="p-2 font-medium text-slate-800 dark:text-slate-200">Year ${y}</td>
                        <td class="p-2 text-slate-500 dark:text-slate-400">${formatCurr(totalDeposited)}</td>
                        <td class="p-2 text-emerald-600 dark:text-emerald-400">+${formatCurr(totalInterestEarned)}</td>
                        <td class="p-2 font-semibold text-brand-600 dark:text-brand-300">${formatCurr(currentBalance)}</td>
                    </tr>
                `);

                activeExportData.push({
                    Year: y,
                    Contributions: totalDeposited.toFixed(2),
                    Interest: totalInterestEarned.toFixed(2),
                    Balance: currentBalance.toFixed(2)
                });
            }

            const totalInterest = currentBalance - totalDeposited;
            // Effective APY calculation: (1 + r/n)^n - 1
            const effectiveAPY = (Math.pow(1 + r / n, n) - 1) * 100;

            // KPI Cards Update
            document.getElementById('card-label-1').innerText = "Total Future Balance";
            document.getElementById('card-val-1').innerText = formatCurr(currentBalance);

            document.getElementById('card-label-2').innerText = "Total Contributions";
            document.getElementById('card-val-2').innerText = formatCurr(totalDeposited);

            document.getElementById('card-label-3').innerText = "Compound Interest";
            document.getElementById('card-val-3').innerText = formatCurr(totalInterest);

            document.getElementById('card-label-4').innerText = "Effective APY";
            document.getElementById('card-val-4').innerText = `${effectiveAPY.toFixed(2)}%`;

            // Table Headers
            document.getElementById('th-col-1').innerText = "Year";
            document.getElementById('th-col-2').innerText = "Total Contributions";
            document.getElementById('th-col-3').innerText = "Interest Earned";
            document.getElementById('th-col-4').innerText = "End Balance";
            document.getElementById('table-body').innerHTML = tableRows.join('');

            // Stacked Bar Chart Render
            document.getElementById('chart-title').innerText = "Exponential Compound Growth";
            document.getElementById('chart-sub').innerText = "Contributions Breakdown vs Compound Yield";

            renderBarChart(labels, principalData, interestData);
            renderInsights('compound', { P, totalDeposited, currentBalance, years, effectiveAPY });
        }

        function calcGoal() {
            const P = parseFloat(document.getElementById('inp-1-num').value) || 0;
            const S = parseFloat(document.getElementById('inp-2-num').value) || 0;
            const depFreq = parseInt(document.getElementById('inp-deposit-freq').value) || 12; // Monthly vs Yearly
            const r = (parseFloat(document.getElementById('inp-3-num').value) || 0) / 100;
            const n = parseInt(document.getElementById('inp-compound-freq').value) || 12;
            const years = Math.max(1, Math.round(parseFloat(document.getElementById('inp-4-num').value) || 1));

            // Future value of initial principal under compounding
            const futureP = P * Math.pow(1 + r / n, n * years);
            const remainingGoal = S - futureP;

            let reqDeposit = 0;
            const totalPeriods = depFreq * years;

            if (remainingGoal > 0 && totalPeriods > 0) {
                // Rate per deposit period approximation
                const periodRate = Math.pow(1 + r / n, n / depFreq) - 1;
                if (periodRate > 0) {
                    reqDeposit = remainingGoal * periodRate / (Math.pow(1 + periodRate, totalPeriods) - 1);
                } else {
                    reqDeposit = remainingGoal / totalPeriods;
                }
            }
            reqDeposit = Math.max(0, reqDeposit);

            const totalContributions = P + (reqDeposit * totalPeriods);
            const totalInterestEarned = S - totalContributions;

            // KPI Cards Update
            const freqText = depFreq === 12 ? '/mo' : '/yr';
            document.getElementById('card-label-1').innerText = "Required Contribution";
            document.getElementById('card-val-1').innerText = `${formatCurr(reqDeposit)}${freqText}`;

            document.getElementById('card-label-2').innerText = "Target Savings Goal";
            document.getElementById('card-val-2').innerText = formatCurr(S);

            document.getElementById('card-label-3').innerText = "Out-of-Pocket Cost";
            document.getElementById('card-val-3').innerText = formatCurr(totalContributions);

            document.getElementById('card-label-4').innerText = "Yield Contribution";
            document.getElementById('card-val-4').innerText = formatCurr(totalInterestEarned);

            // Table Headers & Rows
            document.getElementById('th-col-1').innerText = "Year";
            document.getElementById('th-col-2').innerText = "Contributions Paid";
            document.getElementById('th-col-3').innerText = "Interest Accumulated";
            document.getElementById('th-col-4').innerText = "Progress Balance";

            const labels = [];
            const pathData = [];
            const tableRows = [];
            activeExportData = [];

            let tracker = P;
            const periodRate = Math.pow(1 + r / n, n / depFreq) - 1;

            for (let y = 0; y <= years; y++) {
                labels.push(`Yr ${y}`);
                pathData.push(tracker);

                if (y > 0) {
                    const depositedSoFar = P + (reqDeposit * y * depFreq);
                    const interestSoFar = tracker - depositedSoFar;

                    tableRows.push(`
                        <tr class="hover:bg-slate-100 dark:hover:bg-slate-800/40 transition-colors">
                            <td class="p-2 font-medium text-slate-800 dark:text-slate-200">Year ${y}</td>
                            <td class="p-2 text-slate-500 dark:text-slate-400">${formatCurr(depositedSoFar)}</td>
                            <td class="p-2 text-emerald-600 dark:text-emerald-400">+${formatCurr(Math.max(0, interestSoFar))}</td>
                            <td class="p-2 font-semibold text-brand-600 dark:text-brand-300">${formatCurr(tracker)}</td>
                        </tr>
                    `);

                    activeExportData.push({
                        Year: y,
                        Contributions: depositedSoFar.toFixed(2),
                        Interest: interestSoFar.toFixed(2),
                        Balance: tracker.toFixed(2)
                    });
                }

                // Advance balance by 1 year of deposit steps
                for (let step = 0; step < depFreq; step++) {
                    tracker = (tracker + reqDeposit) * (1 + periodRate);
                }
            }

            document.getElementById('table-body').innerHTML = tableRows.join('');

            // Line Chart Render
            document.getElementById('chart-title').innerText = "Goal Target Trajectory";
            document.getElementById('chart-sub').innerText = "Target Savings Goal vs Required Accumulation Path";

            renderLineChart(labels, [
                {
                    label: 'Target Goal ($)',
                    data: Array(labels.length).fill(S),
                    borderColor: '#ef4444',
                    borderDash: [5, 5],
                    borderWidth: 1.5,
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: 'Accumulation Path ($)',
                    data: pathData,
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.12)',
                    borderWidth: 2.5,
                    fill: true,
                    tension: 0.15
                }
            ]);

            renderInsights('goal', { S, reqDeposit, depFreq, years, totalInterestEarned });
        }

        function renderLineChart(labels, datasets) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: getCommonChartOptions()
            });
        }

        function renderBarChart(labels, principalData, interestData) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Contributions ($)',
                            data: principalData,
                            backgroundColor: '#64748b',
                            borderRadius: 3
                        },
                        {
                            label: 'Compound Interest ($)',
                            data: interestData,
                            backgroundColor: '#10b981',
                            borderRadius: 3
                        }
                    ]
                },
                options: {
                    ...getCommonChartOptions(),
                    scales: {
                        x: { stacked: true, grid: { display: false }, ticks: { color: getChartTextColor(), font: { size: 10 } } },
                        y: { stacked: true, grid: { color: getChartGridColor() }, ticks: { color: getChartTextColor(), font: { size: 10 }, callback: (v) => formatCompact(v) } }
                    }
                }
            });
        }

        function getCommonChartOptions() {
            return {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: { color: getChartTextColor(), font: { family: 'Plus Jakarta Sans', size: 10 } }
                    },
                    tooltip: {
                        padding: 8,
                        callbacks: {
                            label: function(context) {
                                return ` ${context.dataset.label}: ${formatCurr(context.parsed.y)}`;
                            }
                        }
                    }
                },
                scales: {
                    x: { grid: { color: getChartGridColor() }, ticks: { color: getChartTextColor(), font: { size: 10 } } },
                    y: { grid: { color: getChartGridColor() }, ticks: { color: getChartTextColor(), font: { size: 10 }, callback: (v) => formatCompact(v) } }
                }
            };
        }

        function renderInsights(mode, data) {
            const container = document.getElementById('insight-container');
            let html = '';

            if (mode === 'simple') {
                const ratio = ((data.currentInterest / (data.totalDeposits || 1)) * 100).toFixed(1);
                html = `
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="info" class="w-4 h-4 text-brand-500 shrink-0"></i>
                        <span>Generates a total <strong>${ratio}%</strong> simple return over ${data.years} years.</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500 shrink-0"></i>
                        <span>Simple interest yields flat linear returns without compounding benefits.</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="trending-up" class="w-4 h-4 text-cyan-500 shrink-0"></i>
                        <span>Switch to <strong>Compound</strong> tab to unlock exponential wealth growth!</span>
                    </div>
                `;
            } else if (mode === 'compound') {
                const mult = (data.currentBalance / (data.totalDeposited || 1)).toFixed(2);
                html = `
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="trending-up" class="w-4 h-4 text-emerald-500 shrink-0"></i>
                        <span>Multiplies out-of-pocket capital by <strong>${mult}x</strong> over ${data.years} years.</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="clock" class="w-4 h-4 text-indigo-500 shrink-0"></i>
                        <span>Higher compounding frequency increases effective yield (APY: ${data.effectiveAPY.toFixed(2)}%).</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="sparkles" class="w-4 h-4 text-amber-500 shrink-0"></i>
                        <span>Consistent deposits compound faster when started earlier in the timeframe.</span>
                    </div>
                `;
            } else if (mode === 'goal') {
                const covered = ((data.totalInterestEarned / (data.S || 1)) * 100).toFixed(1);
                const freqLabel = data.depFreq === 12 ? 'month' : 'year';
                html = `
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="target" class="w-4 h-4 text-cyan-500 shrink-0"></i>
                        <span>Compound yield pays <strong>${covered}%</strong> of your target savings goal.</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="wallet" class="w-4 h-4 text-emerald-500 shrink-0"></i>
                        <span>Save <strong>${formatCurr(data.reqDeposit)}/${freqLabel}</strong> to reach ${formatCurr(data.S)} in ${data.years} yrs.</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="zap" class="w-4 h-4 text-amber-500 shrink-0"></i>
                        <span>Increasing your expected yield rate drastically reduces required contributions.</span>
                    </div>
                `;
            }

            container.innerHTML = html;
            lucide.createIcons();
        }

        // CSV Export Helper
        function downloadCSV() {
            if (!activeExportData || !activeExportData.length) return;

            const headers = Object.keys(activeExportData[0]).join(',');
            const rows = activeExportData.map(obj => Object.values(obj).join(','));
            const csvContent = "data:text/csv;charset=utf-8," + [headers, ...rows].join('\n');

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${currentMode}_wealthpulse_schedule.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Input & Slider Synchronization Helper
        function bindSync(numId, rngId, callback) {
            const num = document.getElementById(numId);
            const rng = document.getElementById(rngId);

            if (!num || !rng) return;

            rng.addEventListener('input', () => {
                num.value = rng.value;
                callback();
            });

            num.addEventListener('input', () => {
                rng.value = num.value;
                callback();
            });
        }

        window.onload = function() {
            lucide.createIcons();

            // Synchronize number inputs and range sliders
            bindSync('inp-1-num', 'inp-1-rng', recalculate);
            bindSync('inp-2-num', 'inp-2-rng', recalculate);
            bindSync('inp-3-num', 'inp-3-rng', recalculate);
            bindSync('inp-4-num', 'inp-4-rng', recalculate);

            // Initialize app calculations in default 'simple' mode
            setMode('simple');
        };
    </script>
</body>
</html>
