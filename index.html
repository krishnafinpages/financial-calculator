<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Interest & Savings Goal Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        /* High Density Glass Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .dark .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Range Slider styling */
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #6366f1;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(99, 102, 241, 0.4);
            transition: all 0.15s ease-in-out;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #818cf8;
        }

        .compact-input {
            padding: 0.2rem 0.4rem;
            font-size: 0.8125rem;
            line-height: 1.1rem;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white transition-colors duration-200">

    <!-- CLEAN HEADER: Title, Mode Tabs, Export, Theme Toggle -->
    <header class="border-b border-slate-200 dark:border-slate-800/80 bg-white/90 dark:bg-slate-900/80 backdrop-filter backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-3 sm:px-4 h-12 flex items-center justify-between gap-2">
            <!-- Brand -->
            <div class="flex items-center space-x-2 shrink-0">
                <div class="p-1 bg-brand-600/10 dark:bg-brand-600/20 text-brand-600 dark:text-brand-400 rounded-md border border-brand-500/20">
                    <i data-lucide="calculator" class="w-4 h-4"></i>
                </div>
                <h1 class="text-xs sm:text-sm font-bold bg-clip-text text-transparent bg-gradient-to-r from-slate-900 via-slate-700 to-slate-900 dark:from-white dark:via-slate-200 dark:to-slate-400">
                    WealthPulse <span class="text-[9px] font-semibold px-1.5 py-0.5 rounded bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-500/20">Pro</span>
                </h1>
            </div>

            <!-- Tab Mode Buttons -->
            <div class="grid grid-cols-3 gap-1 bg-slate-200/60 dark:bg-slate-950/60 p-0.5 rounded-lg border border-slate-300/50 dark:border-slate-800 text-xs">
                <button onclick="setMode('simple')" id="mode-btn-simple" class="px-2.5 py-1 font-semibold rounded-md transition-all duration-150 text-center bg-brand-600 text-white shadow-sm">
                    Simple Interest
                </button>
                <button onclick="setMode('compound')" id="mode-btn-compound" class="px-2.5 py-1 font-semibold rounded-md transition-all duration-150 text-center text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">
                    Compound Interest
                </button>
                <button onclick="setMode('goal')" id="mode-btn-goal" class="px-2.5 py-1 font-semibold rounded-md transition-all duration-150 text-center text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200">
                    Savings Goal
                </button>
            </div>

            <!-- Quick Theme Switcher & Actions -->
            <div class="flex items-center space-x-2 shrink-0">
                <button onclick="downloadCSV()" class="px-2.5 py-1 text-xs font-semibold text-brand-600 dark:text-brand-400 bg-brand-500/10 hover:bg-brand-500/20 rounded-md border border-brand-500/20 flex items-center gap-1 transition-colors">
                    <i data-lucide="download" class="w-3 h-3"></i>
                    <span class="hidden sm:inline">Export CSV</span>
                </button>
                <button onclick="toggleTheme()" class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="Toggle Theme">
                    <i data-lucide="sun" class="w-3.5 h-3.5 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-3.5 h-3.5 block dark:hidden"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-2 sm:px-3 py-2 space-y-2">
        
        <!-- CORE CONTROLS PANEL: RESTRUCTURED TWO-LINE INPUT LAYOUT -->
        <div class="glass-card p-2.5 rounded-xl space-y-2 shadow-sm border border-slate-200 dark:border-slate-800">
            
            <div class="flex items-center justify-between gap-2 border-b border-slate-200 dark:border-slate-800/80 pb-1.5">
                <div class="flex items-center space-x-1.5">
                    <i data-lucide="sliders" class="w-3.5 h-3.5 text-brand-500"></i>
                    <span class="text-xs font-bold text-slate-700 dark:text-slate-200 uppercase tracking-wider">Calculation Parameters</span>
                </div>

                <span id="formula-badge" class="text-[10px] font-mono text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-900 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-800">
                    A = P(1 + r·t) + Deposit Growth
                </span>
            </div>

            <!-- TWO-LINE PARAMETER INPUT SECTION -->
            <div class="space-y-2">
                
                <!-- LINE 1: FIRST PAIR OF PARAMETERS -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <!-- INPUT 1A -->
                    <div class="space-y-1 bg-slate-50/50 dark:bg-slate-900/40 p-2 rounded-lg border border-slate-200/60 dark:border-slate-800/60">
                        <div class="flex justify-between items-center text-xs">
                            <label id="lbl-1a" class="font-bold text-slate-700 dark:text-slate-300">Principal ($)</label>
                            <input type="number" id="inp-1a-num" value="10000" min="0" max="5000000" step="500"
                                class="compact-input bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-md font-bold text-brand-600 dark:text-brand-400 text-right w-28 focus:outline-none focus:border-brand-500">
                        </div>
                        <input type="range" id="inp-1a-rng" min="0" max="250000" step="500" value="10000" class="w-full h-1 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-brand-500">
                    </div>

                    <!-- INPUT 1B -->
                    <div class="space-y-1 bg-slate-50/50 dark:bg-slate-900/40 p-2 rounded-lg border border-slate-200/60 dark:border-slate-800/60">
                        <div class="flex justify-between items-center text-xs">
                            <label id="lbl-1b" class="font-bold text-slate-700 dark:text-slate-300">Monthly Deposit ($)</label>
                            <input type="number" id="inp-1b-num" value="200" min="0" max="50000" step="25"
                                class="compact-input bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-md font-bold text-cyan-600 dark:text-cyan-400 text-right w-28 focus:outline-none focus:border-brand-500">
                        </div>
                        <input type="range" id="inp-1b-rng" min="0" max="3000" step="25" value="200" class="w-full h-1 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-500">
                    </div>
                </div>

                <!-- LINE 2: SECOND PAIR OF PARAMETERS -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <!-- INPUT 2A: RATE / YIELD -->
                    <div class="space-y-1 bg-slate-50/50 dark:bg-slate-900/40 p-2 rounded-lg border border-slate-200/60 dark:border-slate-800/60">
                        <div class="flex justify-between items-center text-xs">
                            <label id="lbl-2a" class="font-bold text-slate-700 dark:text-slate-300">Annual Interest Rate (%)</label>
                            <input type="number" id="inp-2a-num" value="6.5" min="0" max="30" step="0.1"
                                class="compact-input bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-md font-bold text-emerald-600 dark:text-emerald-400 text-right w-20 focus:outline-none focus:border-brand-500">
                        </div>
                        <input type="range" id="inp-2a-rng" min="0.1" max="25" step="0.1" value="6.5" class="w-full h-1 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                    </div>

                    <!-- INPUT 2B: DURATION & UNITS / FREQUENCY -->
                    <div class="space-y-1 bg-slate-50/50 dark:bg-slate-900/40 p-2 rounded-lg border border-slate-200/60 dark:border-slate-800/60">
                        <div class="flex justify-between items-center text-xs">
                            <label id="lbl-2b" class="font-bold text-slate-700 dark:text-slate-300">Duration / Horizon</label>
                            <div class="flex items-center space-x-1">
                                <input type="number" id="inp-2b-num" value="5" min="1" max="60" step="1"
                                    class="compact-input bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-md font-bold text-indigo-500 text-right w-16 focus:outline-none focus:border-brand-500">
                                <select id="inp-2b-unit" class="compact-input bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs rounded-md text-slate-700 dark:text-slate-300 focus:outline-none font-semibold">
                                    <option value="years" selected>Yrs</option>
                                    <option value="months">Mos</option>
                                </select>
                                <select id="inp-compound-freq" class="hidden compact-input bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 text-xs rounded-md text-slate-700 dark:text-slate-300 focus:outline-none font-semibold">
                                    <option value="12" selected>Monthly (12/yr)</option>
                                    <option value="4">Quarterly (4/yr)</option>
                                    <option value="2">Semi-Annually (2/yr)</option>
                                    <option value="1">Annually (1/yr)</option>
                                    <option value="365">Daily (365/yr)</option>
                                </select>
                            </div>
                        </div>
                        <input type="range" id="inp-2b-rng" min="1" max="30" step="1" value="5" class="w-full h-1 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    </div>
                </div>

            </div>

        </div>

        <!-- RESULTS & VISUALIZATION PANEL -->
        <div class="space-y-2">
            
            <!-- Dynamic KPI Metrics Ribbon -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <div class="glass-card p-2 rounded-xl flex flex-col justify-between">
                    <span id="card-label-1" class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Total Principal</span>
                    <span id="card-val-1" class="text-sm sm:text-base font-extrabold text-slate-800 dark:text-slate-100">$22,000</span>
                </div>
                <div class="glass-card p-2 rounded-xl flex flex-col justify-between">
                    <span id="card-label-2" class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Total Interest</span>
                    <span id="card-val-2" class="text-sm sm:text-base font-extrabold text-emerald-600 dark:text-emerald-400">$5,225</span>
                </div>
                <div class="glass-card p-2 rounded-xl flex flex-col justify-between">
                    <span id="card-label-3" class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Final Balance</span>
                    <span id="card-val-3" class="text-sm sm:text-base font-extrabold text-brand-600 dark:text-brand-400">$27,225</span>
                </div>
                <div id="card-highlight" class="glass-card p-2 rounded-xl flex flex-col justify-between bg-brand-500/5 dark:bg-brand-500/10 border-brand-500/20">
                    <span id="card-label-4" class="text-[10px] font-semibold text-brand-600 dark:text-brand-400 uppercase tracking-wider">Simple Return</span>
                    <span id="card-val-4" class="text-sm sm:text-base font-extrabold text-brand-600 dark:text-brand-400">23.8%</span>
                </div>
            </div>

            <!-- Chart Visualization Card -->
            <div class="glass-card p-2.5 rounded-xl flex flex-col justify-between space-y-1 border border-slate-200 dark:border-slate-800">
                <div class="flex items-center justify-between text-xs">
                    <span id="chart-title" class="font-bold text-slate-700 dark:text-slate-200">Linear Growth Curve</span>
                    <span id="chart-sub" class="text-[10px] text-slate-400">Principal & Contributions vs Interest</span>
                </div>
                <div class="h-44 sm:h-48 w-full relative">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

            <!-- Dynamic Insights Panel -->
            <div class="glass-card p-2 rounded-xl border border-slate-200 dark:border-slate-800">
                <div id="insight-container" class="grid grid-cols-1 md:grid-cols-3 gap-2 text-xs text-slate-600 dark:text-slate-300">
                    <!-- Dynamically filled insights -->
                </div>
            </div>

            <!-- Collapsible Detailed Schedule Table -->
            <div class="glass-card rounded-xl overflow-hidden border border-slate-200 dark:border-slate-800">
                <button onclick="toggleAccordion()" class="w-full px-3 py-1.5 flex items-center justify-between text-xs font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-900/40 transition-colors">
                    <span class="flex items-center gap-1.5">
                        <i data-lucide="table" class="w-3.5 h-3.5 text-brand-500"></i> Schedule Breakdown Table
                    </span>
                    <div class="flex items-center space-x-2">
                        <span onclick="event.stopPropagation(); downloadCSV()" class="text-[11px] text-brand-600 dark:text-brand-400 hover:underline flex items-center gap-1">
                            <i data-lucide="download" class="w-3 h-3"></i> Export
                        </span>
                        <i id="table-arrow" data-lucide="chevron-down" class="w-4 h-4 transition-transform duration-200"></i>
                    </div>
                </button>
                <div id="table-container" class="hidden border-t border-slate-200 dark:border-slate-800 max-h-44 overflow-y-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-100 dark:bg-slate-900/90 text-slate-500 dark:text-slate-400 font-semibold sticky top-0 border-b border-slate-200 dark:border-slate-800">
                            <tr>
                                <th id="th-col-1" class="p-1.5">Period</th>
                                <th id="th-col-2" class="p-1.5">Total Deposits</th>
                                <th id="th-col-3" class="p-1.5">Interest Earned</th>
                                <th id="th-col-4" class="p-1.5">Total Balance</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-200 dark:divide-slate-800/50">
                            <!-- Dynamic rows -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        // State Machine
        let currentMode = 'simple'; // 'simple' | 'compound' | 'goal'
        let chartInstance = null;
        let activeExportData = [];

        // Formatting Helpers
        const formatCurr = (num) => {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                maximumFractionDigits: 0
            }).format(num);
        };

        const formatCompact = (num) => {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                notation: 'compact',
                maximumFractionDigits: 1
            }).format(num);
        };

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            setTimeout(() => {
                recalculate();
            }, 50);
        }

        function toggleAccordion() {
            const container = document.getElementById('table-container');
            const arrow = document.getElementById('table-arrow');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                arrow.style.transform = 'rotate(180deg)';
            } else {
                container.classList.add('hidden');
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        function getChartTextColor() {
            return document.documentElement.classList.contains('dark') ? '#94a3b8' : '#64748b';
        }

        function getChartGridColor() {
            return document.documentElement.classList.contains('dark') ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
        }

        // Mode Switching & In-place UI adaptation
        function setMode(mode) {
            currentMode = mode;

            // Nav buttons update
            ['simple', 'compound', 'goal'].forEach(m => {
                const btn = document.getElementById(`mode-btn-${m}`);
                if (m === mode) {
                    btn.className = "px-2.5 py-1 font-semibold rounded-md transition-all duration-150 text-center bg-brand-600 text-white shadow-sm";
                } else {
                    btn.className = "px-2.5 py-1 font-semibold rounded-md transition-all duration-150 text-center text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200";
                }
            });

            // Labels and Selectors adaptation
            const lbl1a = document.getElementById('lbl-1a');
            const rng1a = document.getElementById('inp-1a-rng');
            const num1a = document.getElementById('inp-1a-num');

            const lbl1b = document.getElementById('lbl-1b');
            const rng1b = document.getElementById('inp-1b-rng');

            const lbl2a = document.getElementById('lbl-2a');
            const lbl2b = document.getElementById('lbl-2b');

            const unitSelect = document.getElementById('inp-2b-unit');
            const freqSelect = document.getElementById('inp-compound-freq');
            const formulaBadge = document.getElementById('formula-badge');

            if (mode === 'simple') {
                formulaBadge.innerText = 'A = P(1 + r·t) + Deposit Growth';
                
                // Line 1: Principal & Monthly Deposit
                lbl1a.innerText = 'Principal ($)';
                rng1a.max = "250000";

                lbl1b.innerText = 'Monthly Deposit ($)';
                rng1b.max = "3000";

                // Line 2: Rate & Duration
                lbl2a.innerText = 'Annual Interest Rate (%)';
                lbl2b.innerText = 'Duration / Time Horizon';

                unitSelect.classList.remove('hidden');
                freqSelect.classList.add('hidden');
            } 
            else if (mode === 'compound') {
                formulaBadge.innerText = 'A = P(1+r/n)^(nt) + PMT PMT_Growth';
                
                // Line 1: Initial Investment & Monthly Deposit
                lbl1a.innerText = 'Initial Investment ($)';
                rng1a.max = "250000";

                lbl1b.innerText = 'Monthly Deposit ($)';
                rng1b.max = "3000";

                // Line 2: Rate & Horizon + Frequency
                lbl2a.innerText = 'Annual Interest Rate (%)';
                lbl2b.innerText = 'Horizon & Frequency';

                unitSelect.classList.add('hidden');
                freqSelect.classList.remove('hidden');
            } 
            else if (mode === 'goal') {
                formulaBadge.innerText = 'Target Goal Reverse Solver';
                
                // Line 1: Initial Savings & Target Goal
                lbl1a.innerText = 'Initial Savings ($)';
                rng1a.max = "500000";

                lbl1b.innerText = 'Target Goal ($)';
                rng1b.max = "1000000";
                if(parseFloat(document.getElementById('inp-1b-num').value) < 10000) {
                    document.getElementById('inp-1b-num').value = "100000";
                    rng1b.value = "100000";
                }

                // Line 2: Annual Yield & Timeframe
                lbl2a.innerText = 'Annual Yield / Rate (%)';
                lbl2b.innerText = 'Timeframe / Duration';

                unitSelect.classList.remove('hidden');
                freqSelect.classList.add('hidden');
            }

            recalculate();
        }

        function recalculate() {
            if (currentMode === 'simple') calcSimple();
            else if (currentMode === 'compound') calcCompound();
            else if (currentMode === 'goal') calcGoal();
        }

        function calcSimple() {
            const P = parseFloat(document.getElementById('inp-1a-num').value) || 0; // Principal
            const PMT = parseFloat(document.getElementById('inp-1b-num').value) || 0; // Monthly Deposit
            const r = (parseFloat(document.getElementById('inp-2a-num').value) || 0) / 100; // Rate
            const timeVal = parseFloat(document.getElementById('inp-2b-num').value) || 0; // Duration
            const timeUnit = document.getElementById('inp-2b-unit').value;

            const timeMonths = Math.max(1, timeUnit === 'months' ? timeVal : timeVal * 12);
            const timeYears = timeMonths / 12;

            // Simple Interest on Principal = P * r * t
            const interestPrincipal = P * r * timeYears;

            // Simple Interest on Monthly Deposits:
            // Sum_{m=1}^{N} PMT * r * ((N - m + 1) / 12) = PMT * r * (N * (N + 1) / 24)
            const interestDeposits = PMT * r * (timeMonths * (timeMonths + 1) / 24);

            const totalDeposits = P + (PMT * timeMonths);
            const totalInterest = interestPrincipal + interestDeposits;
            const totalValue = totalDeposits + totalInterest;
            const returnYield = totalDeposits > 0 ? (totalInterest / totalDeposits) * 100 : 0;

            // Update KPI Cards
            document.getElementById('card-label-1').innerText = "Total Principal";
            document.getElementById('card-val-1').innerText = formatCurr(totalDeposits);

            document.getElementById('card-label-2').innerText = "Total Interest";
            document.getElementById('card-val-2').innerText = formatCurr(totalInterest);

            document.getElementById('card-label-3').innerText = "Final Balance";
            document.getElementById('card-val-3').innerText = formatCurr(totalValue);

            document.getElementById('card-label-4').innerText = "Simple Return";
            document.getElementById('card-val-4').innerText = `${returnYield.toFixed(1)}%`;

            // Table Header & Rows
            document.getElementById('th-col-1').innerText = "Period";
            document.getElementById('th-col-2').innerText = "Deposited Capital";
            document.getElementById('th-col-3').innerText = "Interest Earned";
            document.getElementById('th-col-4').innerText = "Total Balance";

            const numSteps = Math.min(Math.ceil(timeMonths), 48);
            const labels = ['Start'];
            const principalData = [P];
            const interestData = [0];
            const tableRows = [];
            activeExportData = [];

            const stepMonths = timeMonths / numSteps;

            for (let i = 1; i <= numSteps; i++) {
                const currentMo = i * stepMonths;
                const stepLabel = timeUnit === 'months' ? `Mo ${Math.round(currentMo)}` : `Yr ${(currentMo / 12).toFixed(1)}`;
                
                const currDeposits = P + (PMT * currentMo);
                const currIntPrincipal = P * r * (currentMo / 12);
                const currIntDeposits = PMT * r * (currentMo * (currentMo + 1) / 24);
                const currTotalInterest = currIntPrincipal + currIntDeposits;
                const currTotal = currDeposits + currTotalInterest;

                labels.push(stepLabel);
                principalData.push(currDeposits);
                interestData.push(currTotalInterest);

                tableRows.push(`
                    <tr class="hover:bg-slate-100 dark:hover:bg-slate-800/40 transition-colors">
                        <td class="p-2 font-medium text-slate-800 dark:text-slate-200">${stepLabel}</td>
                        <td class="p-2 text-slate-500 dark:text-slate-400">${formatCurr(currDeposits)}</td>
                        <td class="p-2 text-emerald-600 dark:text-emerald-400">+${formatCurr(currTotalInterest)}</td>
                        <td class="p-2 font-semibold text-brand-600 dark:text-brand-300">${formatCurr(currTotal)}</td>
                    </tr>
                `);

                activeExportData.push({
                    Period: stepLabel,
                    Deposits: currDeposits.toFixed(2),
                    Interest: currTotalInterest.toFixed(2),
                    Total: currTotal.toFixed(2)
                });
            }

            document.getElementById('table-body').innerHTML = tableRows.join('');

            // Chart Render
            document.getElementById('chart-title').innerText = "Linear Growth Trajectory";
            document.getElementById('chart-sub').innerText = "Principal & Monthly Deposits vs Simple Interest";

            renderLineChart(labels, [
                {
                    label: 'Total Deposits ($)',
                    data: principalData,
                    borderColor: '#94a3b8',
                    borderDash: [4, 4],
                    borderWidth: 1.5,
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: 'Total Value ($)',
                    data: principalData.map((p, idx) => p + interestData[idx]),
                    borderColor: '#6366f1',
                    backgroundColor: 'rgba(99, 102, 241, 0.12)',
                    borderWidth: 2.5,
                    fill: true,
                    tension: 0.1
                }
            ]);

            renderInsights('simple', { P, PMT, totalInterest, timeYears, totalDeposits });
        }

        function calcCompound() {
            const P = parseFloat(document.getElementById('inp-1a-num').value) || 0; // Initial Investment
            const pmt = parseFloat(document.getElementById('inp-1b-num').value) || 0; // Monthly Deposit
            const r = (parseFloat(document.getElementById('inp-2a-num').value) || 0) / 100; // Rate
            const n = parseInt(document.getElementById('inp-compound-freq').value) || 12; // Frequency
            const timeVal = parseFloat(document.getElementById('inp-2b-num').value) || 1; // Horizon
            const years = Math.max(1, Math.round(timeVal));

            const labels = ['Start'];
            const principalData = [P];
            const interestData = [0];
            const tableRows = [];
            activeExportData = [];

            let currentBalance = P;
            let totalDeposited = P;

            for (let y = 1; y <= years; y++) {
                for (let p = 0; p < n; p++) {
                    const periodInterest = (currentBalance + (pmt * (12 / n))) * (r / n);
                    currentBalance += periodInterest + (pmt * (12 / n));
                    totalDeposited += (pmt * (12 / n));
                }

                const totalInterestEarned = currentBalance - totalDeposited;

                labels.push(`Yr ${y}`);
                principalData.push(totalDeposited);
                interestData.push(totalInterestEarned);

                tableRows.push(`
                    <tr class="hover:bg-slate-100 dark:hover:bg-slate-800/40 transition-colors">
                        <td class="p-2 font-medium text-slate-800 dark:text-slate-200">Year ${y}</td>
                        <td class="p-2 text-slate-500 dark:text-slate-400">${formatCurr(totalDeposited)}</td>
                        <td class="p-2 text-emerald-600 dark:text-emerald-400">+${formatCurr(totalInterestEarned)}</td>
                        <td class="p-2 font-semibold text-brand-600 dark:text-brand-300">${formatCurr(currentBalance)}</td>
                    </tr>
                `);

                activeExportData.push({
                    Year: y,
                    Deposits: totalDeposited.toFixed(2),
                    Interest: totalInterestEarned.toFixed(2),
                    Balance: currentBalance.toFixed(2)
                });
            }

            const totalInterest = currentBalance - totalDeposited;
            const interestShare = currentBalance > 0 ? (totalInterest / currentBalance) * 100 : 0;

            // KPI Cards Update
            document.getElementById('card-label-1').innerText = "Total Deposits";
            document.getElementById('card-val-1').innerText = formatCurr(totalDeposited);

            document.getElementById('card-label-2').innerText = "Compound Interest";
            document.getElementById('card-val-2').innerText = formatCurr(totalInterest);

            document.getElementById('card-label-3').innerText = "Future Balance";
            document.getElementById('card-val-3').innerText = formatCurr(currentBalance);

            document.getElementById('card-label-4').innerText = "Interest Share";
            document.getElementById('card-val-4').innerText = `${interestShare.toFixed(1)}%`;

            // Table Headers
            document.getElementById('th-col-1').innerText = "Year";
            document.getElementById('th-col-2').innerText = "Total Deposits";
            document.getElementById('th-col-3').innerText = "Interest Earned";
            document.getElementById('th-col-4').innerText = "End Balance";
            document.getElementById('table-body').innerHTML = tableRows.join('');

            // Bar Chart Render
            document.getElementById('chart-title').innerText = "Stacked Compound Growth";
            document.getElementById('chart-sub').innerText = "Deposits vs Compound Interest Earnings";

            renderBarChart(labels, principalData, interestData);
            renderInsights('compound', { P, totalDeposited, currentBalance, years });
        }

        function calcGoal() {
            const P = parseFloat(document.getElementById('inp-1a-num').value) || 0; // Initial Savings
            const S = parseFloat(document.getElementById('inp-1b-num').value) || 0; // Target Goal
            const r = (parseFloat(document.getElementById('inp-2a-num').value) || 0) / 100; // Annual Yield
            const timeVal = parseFloat(document.getElementById('inp-2b-num').value) || 1;
            const timeUnit = document.getElementById('inp-2b-unit').value;
            const years = Math.max(1, timeUnit === 'months' ? timeVal / 12 : timeVal);

            const n = 12;
            const t = years;
            const i = r / n;
            const totalMonths = Math.ceil(t * n);

            const futureValInitial = P * Math.pow(1 + i, totalMonths);
            const remainingGoal = S - futureValInitial;

            let reqMonthly = 0;
            if (remainingGoal > 0) {
                if (i > 0) {
                    reqMonthly = remainingGoal * i / (Math.pow(1 + i, totalMonths) - 1);
                } else {
                    reqMonthly = remainingGoal / totalMonths;
                }
            }

            reqMonthly = Math.max(0, reqMonthly);

            const totalDeposits = P + (reqMonthly * totalMonths);
            const totalInterestEarned = S - totalDeposits;

            // KPI Cards Update
            document.getElementById('card-label-1').innerText = "Required Monthly";
            document.getElementById('card-val-1').innerText = `${formatCurr(reqMonthly)}/mo`;

            document.getElementById('card-label-2').innerText = "Target Savings Goal";
            document.getElementById('card-val-2').innerText = formatCurr(S);

            document.getElementById('card-label-3').innerText = "Out-of-Pocket";
            document.getElementById('card-val-3').innerText = formatCurr(totalDeposits);

            document.getElementById('card-label-4').innerText = "Yield Growth Share";
            document.getElementById('card-val-4').innerText = formatCurr(totalInterestEarned);

            // Table Headers & Rows
            document.getElementById('th-col-1').innerText = "Year";
            document.getElementById('th-col-2').innerText = "Deposits Paid";
            document.getElementById('th-col-3').innerText = "Yield Contribution";
            document.getElementById('th-col-4').innerText = "Accumulated Balance";

            const labels = [];
            const pathData = [];
            const tableRows = [];
            activeExportData = [];

            let tracker = P;
            for(let y = 0; y <= years; y++) {
                const yearLabel = `Yr ${y}`;
                labels.push(yearLabel);
                pathData.push(tracker);

                if (y > 0) {
                    const depositedSoFar = P + (reqMonthly * y * 12);
                    const interestSoFar = tracker - depositedSoFar;

                    tableRows.push(`
                        <tr class="hover:bg-slate-100 dark:hover:bg-slate-800/40 transition-colors">
                            <td class="p-2 font-medium text-slate-800 dark:text-slate-200">Year ${y}</td>
                            <td class="p-2 text-slate-500 dark:text-slate-400">${formatCurr(depositedSoFar)}</td>
                            <td class="p-2 text-emerald-600 dark:text-emerald-400">+${formatCurr(Math.max(0, interestSoFar))}</td>
                            <td class="p-2 font-semibold text-brand-600 dark:text-brand-300">${formatCurr(tracker)}</td>
                        </tr>
                    `);

                    activeExportData.push({
                        Year: y,
                        Deposits: depositedSoFar.toFixed(2),
                        Interest: interestSoFar.toFixed(2),
                        Balance: tracker.toFixed(2)
                    });
                }

                for(let m = 0; m < 12; m++) {
                    tracker = tracker * (1 + i) + reqMonthly;
                }
            }

            document.getElementById('table-body').innerHTML = tableRows.join('');

            // Line Chart Render
            document.getElementById('chart-title').innerText = "Target Milestone Trajectory";
            document.getElementById('chart-sub').innerText = "Target Line vs Savings Growth Path";

            renderLineChart(labels, [
                {
                    label: 'Target Goal ($)',
                    data: Array(labels.length).fill(S),
                    borderColor: '#ef4444',
                    borderDash: [5, 5],
                    borderWidth: 1.5,
                    pointRadius: 0,
                    fill: false
                },
                {
                    label: 'Accumulation Path ($)',
                    data: pathData,
                    borderColor: '#10b981',
                    backgroundColor: 'rgba(16, 185, 129, 0.12)',
                    borderWidth: 2.5,
                    fill: true,
                    tension: 0.15
                }
            ]);

            renderInsights('goal', { S, reqMonthly, years, totalInterestEarned });
        }

        function renderLineChart(labels, datasets) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: getCommonChartOptions()
            });
        }

        function renderBarChart(labels, principalData, interestData) {
            const ctx = document.getElementById('mainChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Deposits ($)',
                            data: principalData,
                            backgroundColor: '#64748b',
                            borderRadius: 3
                        },
                        {
                            label: 'Interest ($)',
                            data: interestData,
                            backgroundColor: '#10b981',
                            borderRadius: 3
                        }
                    ]
                },
                options: {
                    ...getCommonChartOptions(),
                    scales: {
                        x: { stacked: true, grid: { display: false }, ticks: { color: getChartTextColor(), font: { size: 10 } } },
                        y: { stacked: true, grid: { color: getChartGridColor() }, ticks: { color: getChartTextColor(), font: { size: 10 }, callback: (v) => formatCompact(v) } }
                    }
                }
            });
        }

        function getCommonChartOptions() {
            return {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: { color: getChartTextColor(), font: { family: 'Plus Jakarta Sans', size: 10 } }
                    },
                    tooltip: {
                        padding: 8,
                        callbacks: {
                            label: function(context) {
                                return ` ${context.dataset.label}: ${formatCurr(context.parsed.y)}`;
                            }
                        }
                    }
                },
                scales: {
                    x: { grid: { color: getChartGridColor() }, ticks: { color: getChartTextColor(), font: { size: 10 } } },
                    y: { grid: { color: getChartGridColor() }, ticks: { color: getChartTextColor(), font: { size: 10 }, callback: (v) => formatCompact(v) } }
                }
            };
        }

        function renderInsights(mode, data) {
            const container = document.getElementById('insight-container');
            let html = '';

            if (mode === 'simple') {
                const ratio = ((data.totalInterest / (data.totalDeposits || 1)) * 100).toFixed(1);
                html = `
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="info" class="w-4 h-4 text-brand-500 shrink-0"></i>
                        <span>Generates <strong>${ratio}%</strong> simple return over ${data.timeYears} years.</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500 shrink-0"></i>
                        <span>Monthly deposits accumulate flat linear interest without compounding.</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="trending-up" class="w-4 h-4 text-cyan-500 shrink-0"></i>
                        <span>Switch to <strong>Compound</strong> tab to see exponential interest gains!</span>
                    </div>
                `;
            } else if (mode === 'compound') {
                const mult = (data.currentBalance / (data.totalDeposited || 1)).toFixed(2);
                html = `
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="trending-up" class="w-4 h-4 text-emerald-500 shrink-0"></i>
                        <span>Expands capital by <strong>${mult}x</strong> total deposits over ${data.years} years.</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="clock" class="w-4 h-4 text-indigo-500 shrink-0"></i>
                        <span>Longer duration enables compounding to outpace principal deposits.</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="sparkles" class="w-4 h-4 text-amber-500 shrink-0"></i>
                        <span>Regular monthly deposits significantly boost exponential growth.</span>
                    </div>
                `;
            } else if (mode === 'goal') {
                const covered = ((data.totalInterestEarned / (data.S || 1)) * 100).toFixed(1);
                html = `
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="target" class="w-4 h-4 text-cyan-500 shrink-0"></i>
                        <span>Yield growth covers <strong>${covered}%</strong> of your target savings goal.</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="wallet" class="w-4 h-4 text-emerald-500 shrink-0"></i>
                        <span>Save <strong>${formatCurr(data.reqMonthly)}/mo</strong> to hit ${formatCurr(data.S)} in ${data.years} yrs.</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <i data-lucide="zap" class="w-4 h-4 text-amber-500 shrink-0"></i>
                        <span>Increase yield rate or timeframe to reduce required monthly deposits.</span>
                    </div>
                `;
            }

            container.innerHTML = html;
            lucide.createIcons();
        }

        function downloadCSV() {
            if (!activeExportData || !activeExportData.length) return;

            const headers = Object.keys(activeExportData[0]).join(',');
            const rows = activeExportData.map(obj => Object.values(obj).join(','));
            const csvContent = "data:text/csv;charset=utf-8," + [headers, ...rows].join('\n');

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${currentMode}_interest_schedule.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Two-way Input Sync Utility
        function bindSync(numId, rngId, callback) {
            const num = document.getElementById(numId);
            const rng = document.getElementById(rngId);

            if (!num || !rng) return;

            rng.addEventListener('input', () => {
                num.value = rng.value;
                callback();
            });

            num.addEventListener('input', () => {
                rng.value = num.value;
                callback();
            });
        }

        window.onload = function() {
            lucide.createIcons();

            // Bind unified synchronized inputs across two lines
            bindSync('inp-1a-num', 'inp-1a-rng', recalculate);
            bindSync('inp-1b-num', 'inp-1b-rng', recalculate);
            bindSync('inp-2a-num', 'inp-2a-rng', recalculate);
            bindSync('inp-2b-num', 'inp-2b-rng', recalculate);

            document.getElementById('inp-2b-unit').addEventListener('change', recalculate);
            document.getElementById('inp-compound-freq').addEventListener('change', recalculate);

            // Initial render in Simple mode
            setMode('simple');
        };
    </script>
</body>
</html>
